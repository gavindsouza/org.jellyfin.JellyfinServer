name: Build Flatpak

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install flatpak and add Flathub
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user flathub org.flatpak.Builder --noninteractive -y

      - name: Install runtime and SDK
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.dotnet10//25.08 \
            org.freedesktop.Sdk.Extension.node24//25.08 \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --arch=x86_64 \
            --repo=repo \
            --force-clean \
            build-dir \
            org.jellyfin.JellyfinServer.yml

      - name: Lint manifest
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest org.jellyfin.JellyfinServer.yml

      - name: Lint repository
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Validate AppStream metadata
        run: flatpak run --command=appstreamcli org.flatpak.Builder validate org.jellyfin.JellyfinServer.metainfo.xml

      - name: Create bundle
        run: flatpak build-bundle repo --arch x86_64 JellyfinServer-amd64.flatpak org.jellyfin.JellyfinServer

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinServer-x86_64
          path: JellyfinServer-amd64.flatpak
